# One-click deploy on Render (free plan). Secrets are entered in the Render dashboard.
services:
  - type: web
    name: isp-voice-support
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: TECH_PIN
        sync: false
      - key: ISP_NAME
        value: NetConnect
      - key: ASSISTANT_NAME
        value: Asha
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_VOICE
        value: Kore
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
