<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edf0">
  <title>Internet Help Line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231c2530'/><circle cx='16' cy='16' r='5' fill='%2322a85a'/></svg>">
</head>
<body>
  <main class="caller">
    <header>
      <div class="brand"><div class="brand-mark"><span></span></div><span id="ispName">NetConnect</span></div>
      <span class="led" id="ledNet" data-c="off" data-i18n="netLed">Connection</span>
    </header>

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
      <button type="button" data-lang="kn" aria-pressed="false" lang="kn">ಕನ್ನಡ</button>
    </div>

    <section class="console" aria-live="polite">
      <h1 data-i18n="title">Internet not working?</h1>
      <p class="lede" data-i18n="lede">Talk to our voice assistant.</p>

      <button class="key" id="key" type="button" data-state="idle" aria-label="Start call" aria-describedby="keyLabel">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
        </svg>
      </button>
      <div class="key-label" id="keyLabel" data-i18n="tapToCall">Tap to call</div>

      <div class="controls">
        <button class="btn" id="muteBtn" type="button" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span data-i18n="mute">Mute</span>
        </button>
        <button class="btn" id="techBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span data-i18n="techBtn">Technician</span>
        </button>
        <button class="btn btn-danger" id="endBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 15c5-5 13-5 18 0l-3 3-3-2v-2a10 10 0 0 0-6 0v2l-3 2z"/></svg>
          <span data-i18n="end">End call</span>
        </button>
      </div>

      <div class="leds">
        <span class="led" id="ledMic" data-c="off" data-i18n="micLed">Microphone</span>
        <span class="led" id="ledAi" data-c="off" data-i18n="aiLed">Voice assistant</span>
        <span class="led" id="ledTech" data-c="off" data-i18n="techLed">Technician</span>
        <span class="led" id="ledTime" data-c="off">0:00</span>
      </div>
    </section>

    <section class="talk">
      <h2 data-i18n="conversation">Conversation</h2>
      <div class="transcript" id="transcript" aria-live="polite">
        <div class="line system" id="emptyLine" data-i18n="empty">Your conversation will appear here.</div>
      </div>
    </section>

    <p class="latency" id="latency" hidden><span data-i18n="latency">Average reply time</span>: <strong id="latencyVal">–</strong></p>

    <audio id="remote" autoplay playsinline></audio>
  </main>
  <script type="module" src="caller.js"></script>
</body>
</html>
